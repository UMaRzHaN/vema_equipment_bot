name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # Audit for known vulnerabilities (non-zero exit on critical)
      - name: Security audit
        run: npm audit --audit-level=high

  # ─── 2. Unit tests ──────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Run unit tests
        run: npm test
        env:
          NODE_ENV: test
          BOT_TOKEN: test-token-ci-placeholder
          WEBHOOK_URL: https://test.example.com
          POSTGRES_PASSWORD: test
          REDIS_PASSWORD: ""

  # ─── 3. Integration tests ────────────────────────────────────────────────────
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vema_bot_test
          POSTGRES_USER: vema
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd "pg_isready -U vema -d vema_bot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      BOT_TOKEN: test-token-ci-placeholder
      WEBHOOK_URL: https://test.example.com
      WEBHOOK_SECRET: ci-test-webhook-secret-32chars
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: vema_bot_test
      POSTGRES_USER: vema
      POSTGRES_PASSWORD: testpassword
      DATABASE_URL: postgresql://vema:testpassword@localhost:5432/vema_bot_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      ADMIN_IDS: "12345"
      LOG_LEVEL: error

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Run migrations
        run: npm run migrate

      - name: Verify DB integrity
        run: node scripts/verify-integrity.js

      - name: Run integration tests
        run: npm run test:integration --if-present
        # Falls back silently if script not defined — add test:integration to package.json

  # ─── 4. Docker build validation ──────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: vema-equipment-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Summary gate ─────────────────────────────────────────────────────────────
  ci-pass:
    name: CI Pass
    needs: [lint, test-unit, test-integration, docker-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}"             != "success" ]] ||
             [[ "${{ needs.test-unit.result }}"        != "success" ]] ||
             [[ "${{ needs.test-integration.result }}" != "success" ]] ||
             [[ "${{ needs.docker-build.result }}"     != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed"
