# ------------------------------------------------------------------------------
# DEVELOPMENT / LOCAL - uses polling mode (no webhook / domain required)
# Usage:
#   cp .env.example .env   # fill in BOT_TOKEN, ADMIN_IDS
#   docker compose up --build
#
# For production (webhook mode) use: docker compose -f docker-compose.prod.yml up
# ------------------------------------------------------------------------------

services:
  # Run pending migrations, then exit
  test:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
    env_file: .env
    environment:
      NODE_ENV: test
      BOT_TOKEN: 1234567890
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-vema_bot}
      POSTGRES_USER: ${POSTGRES_USER:-vema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
    command: sh -lc "npm ci && npm test"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vema-net

  migrate:
    build: .
    command: npm run migrate
    env_file: .env
    environment:
      NODE_ENV: development
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-vema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-vema_bot}
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-vema}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-vema_bot}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vema-net
    restart: "no"

  # Bot in polling mode
  app:
    build: .
    container_name: vema-bot-dev
    restart: unless-stopped
    command: node src/app.polling.js
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NODE_ENV: development
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-vema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-vema_bot}
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-vema}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-vema_bot}
      REDIS_HOST: redis
      # No Redis password in dev
      REDIS_PASSWORD: ""
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - vema-net

  postgres:
    image: postgres:16-alpine
    container_name: vema-postgres-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vema_bot}
      POSTGRES_USER: ${POSTGRES_USER:-vema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vema} -d ${POSTGRES_DB:-vema_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vema-net

  redis:
    image: redis:7-alpine
    container_name: vema-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vema-net

volumes:
  postgres-dev-data:
  redis-dev-data:

networks:
  vema-net:
    driver: bridge
